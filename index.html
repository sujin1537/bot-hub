<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>봇 총괄</title><style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#161a21;--mut:#6b7280;--ln:#e5e7eb;--ac:#2563eb;--tile:#f0f2f5;--up:#d92d20;--dn:#1d6fe8}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--card:#1a1b1e;--tx:#e9ecf1;--mut:#9aa3b2;--ln:#2a2d33;--ac:#5b8def;--tile:#22252b;--up:#ff6b5e;--dn:#6aa8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 56px}h1{font-size:17px;margin:0 0 2px}.upd{color:var(--mut);font-size:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px 0;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:650;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.nm{font-weight:650}.md{color:var(--mut);font-size:12px;margin-left:6px}
.st{font-size:13px;white-space:nowrap}.hl{color:var(--mut);font-size:13px;margin-top:4px}
h2{font-size:14px;margin:16px 2px 8px;color:var(--mut);font-weight:650}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.kv div{background:var(--tile);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--mut)}.kv b{display:block;color:var(--tx);font-size:14px}
details{border-top:1px solid var(--ln);padding:6px 0}details:first-of-type{border-top:0}summary{cursor:pointer;font-weight:650;padding:4px 0}
.it{padding:6px 0 6px 2px;border-top:1px dashed var(--ln)}.it:first-of-type{border-top:0}.sym{font-weight:650}.px{color:var(--mut);font-size:13px;margin-left:6px}.nt{color:var(--mut);font-size:12.5px}
a.card{display:block;color:inherit;text-decoration:none}.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--tile);font-size:12px;margin:0 4px 4px 0}
</style></head><body><main><h1>봇 총괄</h1><div class="upd" id="u">불러오는 중…</div>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">자동매매</button><button id="t2" onclick="tab(2)">전략분석</button></div>
<div id="p1"></div><div id="p2" hidden></div>
<script>
const rp=location.hostname.split('.')[0]+'/'+location.pathname.split('/')[1];
const I={"정상":"🟢","확인됨":"🟢","지연":"🟡","멈춤":"🔴","일시정지":"⏸","미가동":"⚪","오래됨":"🟡","읽기 실패":"🔴"};
const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function tab(n){for(const i of [1,2]){document.getElementById('p'+i).hidden=i!==n;document.getElementById('t'+i).className=i===n?'on':'';}try{location.hash='t'+n}catch(_){}}
const card=b=>`<${b.url?'a href="'+e(b.url)+'"':'div'} class="card"><div class="row"><div><span class="nm">${e(b.name)}</span><span class="md">${e(b.mode||'')}</span></div><div class="st">${I[b.state]||'⚪'} ${e(b.state)}</div></div><div class="hl">${e(b.headline||'')}${b.url?' · 자세히 ›':''}</div></${b.url?'a':'div'}>`;
const kv=(k,v)=>`<div>${k}<b>${v==null?'-':v}</b></div>`;
function tsla(a,b){if(!a)return '';const L=a.lines||{};const dir=(a.close&&L.hi20)?((a.close/L.hi20-1)*100).toFixed(1)+'%':'-';
return `<h2>테슬라</h2>`+(b?card(b):'')+`<div class="card"><div class="nm">오늘의 판단 <span class="md">${e(a.day)} 종가 기준</span></div><div class="hl" style="font-size:14px;color:var(--tx)">${e(a.why)}</div>
<div class="kv">${kv('종가','$'+a.close)}${kv('20일선','$'+L.m20)}${kv('60일선','$'+L.m60)}${kv('200일선','$'+L.m200)}${kv('돌파선(20일 최고)','$'+L.hi20)}${kv('손절선(10일 최저)','$'+L.lo10)}</div>
<div class="hl">종가가 돌파선보다 ${dir} · 변동성 ${a.vol_pct}% · 목표 배수 ${a.target}배</div>
<div style="margin-top:8px">${(a.tranches||[]).map(t=>`<span class="tag">${e(t.date)} 매수회차 ${t.status==='wait'?'대기':e(t.status)}</span>`).join('')}</div></div>`;}
function us(a,b){if(!a)return '';if(a.error)return '';
return `<h2>미국주식 · AI·반도체 차트 <span class="md">${e(a.asof)} 기준</span></h2>`+(a.watch&&a.watch.length?`<div class="card"><div class="nm">관심 종목 등급</div>${a.watch.map(x=>`<div class="it"><span class="sym">${e(x.sym)}</span> <span>${e(x.label)}</span></div>`).join('')}</div>`:'')+(a.hot?`<div class="card"><div class="hl">📌 돈이 몰리는 곳: ${e(a.hot)}</div><div class="hl">📌 힘이 빠진 곳: ${e(a.cold)}</div></div>`:'')+
`<div class="card">${a.groups.map((g,i)=>`<details${i===0?' open':''}><summary>${e(g.label)} <span class="md">${g.items.length}개</span></summary>${g.items.map(x=>`<div class="it"><span class="sym">${e(x.sym)}</span> <span>${e(x.name)}</span><span class="px">${e(x.price)}</span>${x.note.map(n=>`<div class="nt">${e(n)}</div>`).join('')}</div>`).join('')}</details>`).join('')}</div>`;}
function kr(a,b){if(!a||a.error)return '';
return `<h2>국내주식</h2>`+`<div class="card"><div class="nm">관심 종목 등급</div>${a.rating.map(x=>`<div class="it"><span class="sym">${e(x.name||x.sym)}</span><span class="px">${e(x.sym)}</span> <span>${e(x.label)}</span></div>`).join('')}</div>`+
(a.reentry.length?`<div class="card"><div class="nm">재진입 조건</div>${a.reentry.map(x=>`<div class="it"><span class="sym">${e(x.name||x.sym)}</span> <span>${x.on?'🟢 충족':'⚪ 미충족'}</span><div class="nt">${e(x.detail)}</div></div>`).join('')}</div>`:'');}
fetch('https://raw.githubusercontent.com/'+rp+'/data/hub.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(s=>{
document.getElementById('u').textContent='갱신 '+s.ts+' (KST) · 금액·수량·보유 종목은 공개하지 않음';
const B=Object.fromEntries(s.bots.map(b=>[b.id,b]));const A=s.analysis||{};
document.getElementById('p1').innerHTML=['kimp','btc'].filter(k=>B[k]).map(k=>{const b=B[k];const t=b.ret_pct!=null?`<div class="kv" style="margin:-4px 0 10px">${kv('원금 대비',(b.ret_pct>0?'+':'')+b.ret_pct+'%')}${kv('완료 거래',b.trades==null?'-':b.trades+'회')}${kv('포지션',e(b.position||'-'))}</div>`:'';return card(b)+t}).join('');
document.getElementById('p2').innerHTML=tsla(A.tsla,B.tsla)+us(A.us)+kr(A.kr)+(B.stock?'<h2>분석 봇 상태</h2>'+card(B.stock):'');
if(location.hash==='#t2')tab(2);
}).catch(()=>{document.getElementById('u').textContent='불러오지 못했습니다'});
</script></main></body></html>
