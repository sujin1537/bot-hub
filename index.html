.big{font-size:28px;font-weight:700;letter-spacing:-.03em}.big span{font-size:17px;margin-left:4px}.side{font-size:14px;color:var(--sub);margin-top:4px}.side span{color:var(--mut);margin-left:6px}

@media(min-width:700px){#rcm{align-items:center;padding:16px}#rcm .rcw{border-radius:26px}main{padding-top:36px}.hi{font-size:30px}}

</style></head><body><main><div id="rcm" hidden><div class="rcw"><button class="rcc" aria-label="닫기">×</button><div class="rcb"></div></div></div><div id="root"><div class="hd"><p class="hi">불러오는 중이에요</p></div></div>
<script>
const rp=location.hostname.split('.')[0]+'/'+location.pathname.split('/')[1];
const I={"정상":"🟢","확인됨":"🟢","지연":"🟡","멈춤":"🔴","일시정지":"⏸","미가동":"⚪","오래됨":"🟡","읽기 실패":"🔴"};
const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let gid=0;
function tabs(items,cls){const g='g'+(gid++);return `<div class="${cls}">`+items.map((x,i)=>`<button data-g="${g}" data-i="${i}" class="${i?'':'on'}">${x[0]}</button>`).join('')+`</div>`+items.map((x,i)=>`<div class="pane" data-g="${g}" data-i="${i}"${i?' hidden':''}>${x[1]}</div>`).join('');}
document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-g]');if(!b)return;const g=b.dataset.g,i=b.dataset.i;
document.querySelectorAll(`[data-g="${g}"]`).forEach(el=>{if(el.tagName==='BUTTON')el.className=el.dataset.i===i?'on':'';else el.hidden=el.dataset.i!==i;});
});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-rc]');const m=document.getElementById('rcm');
if(t){const x=window._rc[+t.dataset.rc];m.querySelector('.rcb').innerHTML=`<div class="nm" style="margin-bottom:6px">${e(x.t)}</div>`+(x.html||'')+(x.html&&(x.why||[]).length?'<div class="nm" style="margin:14px 0 4px;font-size:15px">왜 좋게 봤나</div>':'')+(x.why||[]).map(w=>`<div class="it">• ${e(w)}</div>`).join('')+((x.src||[]).length?`<div class="nm" style="margin:12px 0 4px">근거 글 <span class="md">구독자 로그인 필요</span></div>`+x.src.map(s=>`<a class="it" style="display:block;color:var(--ac);text-decoration:none" href="${e(s.u)}" target="_blank" rel="noopener">${e(s.d)} · ${e(s.t)} ↗</a>`).join(''):'');m.hidden=false;return;}
if(m&&!m.hidden&&(ev.target===m||ev.target.closest('.rcc')))m.hidden=true;});
const card=b=>`<${b.url?'a href="'+e(b.url)+'"':'div'} class="card"><div class="row"><div><span class="nm">${e(b.name)}</span><span class="md">${e(b.mode||'')}</span></div><div class="st">${I[b.state]||'⚪'} ${e(b.state)}</div></div><div class="hl">${e(b.headline||'')}${b.url?' · 자세히 ›':''}</div></${b.url?'a':'div'}>`;
const kv=(k,v)=>`<div>${k}<b>${v==null?'-':v}</b></div>`;
const pc=v=>(v>0?'+':'')+v+'%';const cl=v=>v>0?'upc':v<0?'dnc':'';
function usmarket(a){if(!a)return '<div class="card nt">자료 없음</div>';const G=a.grade,tot=a.n;const col={"강한 매수":'#0e9f6e',"매수":'#7bc7a4',"중립":'#b7bdc8',"매도":'#f0a39b',"강한 매도":'#d92d20'};
const li=l=>l.map(x=>`<div class="li"><span>${e(x.sym)} <span class="md">${e(x.name)}</span></span><span class="${cl(x.d1)}">${pc(x.d1)}</span></div>`).join('')||'<div class="nt">없음</div>';
const rs=l=>l.map(x=>`<div class="li"><span>${e(x.sym)} <span class="md">${e(x.name)}</span></span><span>RSI ${x.rsi}</span></div>`).join('')||'<div class="nt">없음</div>';
return `<h2>시장 개요 <span class="md">${e(a.asof)} 종가 · ${a.n.toLocaleString()}종목 스캔</span></h2>
<div class="card"><div class="kv">${kv('상승 종목 비율',a.up_pct+'%')}${kv('평균 RSI',a.avg_rsi)}${kv('강한 매수 등급',G['강한 매수']+'개')}</div>
<div class="bar">${Object.keys(G).map(k=>`<i style="width:${G[k]*100/tot}%;background:${col[k]}"></i>`).join('')}</div>
<div class="nt">${Object.keys(G).map(k=>`<span style="color:${col[k]}">●</span> ${k} ${G[k]}`).join(' · ')}</div></div>
<h2>오늘 많이 움직인 종목 <span class="md">시총 상위 300 중</span></h2>
<div class="two"><div class="card"><div class="nm" style="font-size:13px">상승 TOP</div>${li(a.up)}</div><div class="card"><div class="nm" style="font-size:13px">하락 TOP</div>${li(a.down)}</div></div>
<h2>RSI 과열 · 과매도 <span class="md">시총 상위 300 중</span></h2>
<div class="two"><div class="card"><div class="nm" style="font-size:13px">과매도 (RSI&lt;30)</div>${rs(a.oversold)}</div><div class="card"><div class="nm" style="font-size:13px">과열 (RSI&gt;70)</div>${rs(a.overbought)}</div></div>
`+(a.signals&&a.signals.length?`<h2>오늘 나온 매수 신호 <span class="md">시총 상위 150 중</span></h2><div class="card">${a.signals.map(x=>`<div class="it"><span class="sym">${e(x.sym)}</span> <span class="px">${e(x.name)}</span><div class="nt">${x.hits.map(e).join(' · ')}</div></div>`).join('')}</div>`:'');}
function usrec(a){if(!a||a.error)return '<div class="card nt">자료 없음</div>';
return `<h2>AI·반도체 차트 <span class="md">${e(a.asof)} 기준</span></h2>`+(a.hot?`<div class="card"><div class="hl">📌 돈이 몰리는 곳: ${e(a.hot)}</div><div class="hl">📌 힘이 빠진 곳: ${e(a.cold)}</div></div>`:'')+
`<div class="card">${a.groups.map((g,i)=>`<details${i===0?' open':''}><summary>${e(g.label)} <span class="md">${g.items.length}개</span></summary>${g.items.map(x=>`<div class="it"><span class="sym">${e(x.sym)}</span> <span>${e(x.name)}</span><span class="px">${e(x.price)}</span>${x.note.map(n=>`<div class="nt">${e(n)}</div>`).join('')}</div>`).join('')}</details>`).join('')}</div>`+
(a.watch&&a.watch.length?`<h2>내 관심 종목</h2><div class="card">${a.watch.map(x=>`<div class="it"><span class="sym">${e(x.sym)}</span> <span>${e(x.label)}</span></div>`).join('')}</div>`:'');}

const err=a=>a&&a.error?`<div class="card nt">불러오지 못했어요 (${e(a.error)})</div>`:null;
const LC={};
function lc(o){const id='lc'+Object.keys(LC).length,CW=Math.max(290,Math.min(580,(document.documentElement.clientWidth||380)-64)),W=CW,H=o.H||250,L=o.L||46,R=o.R||12,T=o.T||10,B=o.B||26;
const xs=o.x,ys=o.y,lg=ys.log?Math.log10:(v=>v);
const X=v=>L+(v-xs.min)/(xs.max-xs.min)*(W-L-R),Y=v=>T+(1-(lg(v)-lg(ys.min))/(lg(ys.max)-lg(ys.min)))*(H-T-B);
