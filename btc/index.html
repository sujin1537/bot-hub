<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>비트코인 추세 현황판</title><style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#161a21;--mut:#6b7280;--ln:#e5e7eb;--ac:#2563eb;--tile:#f0f2f5;--up:#d92d20;--dn:#1d6fe8;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--card:#1a1b1e;--tx:#e9ecf1;--mut:#9aa3b2;--ln:#2a2d33;--ac:#5b8def;--tile:#22252b;--up:#ff6b5e;--dn:#6aa8ff;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 56px}h1{font-size:19px;margin:0 0 2px;letter-spacing:-.2px}.upd{color:var(--mut);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px}
h2{font-size:14px;margin:16px 2px 8px;color:var(--mut);font-weight:650}
.big{font-size:17px;font-weight:700;line-height:1.4}.mut{color:var(--mut);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}.kv div{background:var(--tile);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--mut)}.kv b{display:block;color:var(--tx);font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 3px;text-align:right;border-top:1px solid var(--ln)}th{color:var(--mut);font-weight:600;border-top:0}th:first-child,td:first-child{text-align:left}
.up{color:var(--up)}.dn{color:var(--dn)}.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--tile);font-size:12px;margin-right:4px}
.rv{border-top:1px dashed var(--ln);padding:8px 0;font-size:13px}.rv:first-child{border-top:0}pre{white-space:pre-wrap;margin:4px 0 0;font:inherit;color:var(--mut)}
svg{width:100%;height:auto;display:block}.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:4px}.lg i{display:inline-block;width:10px;height:3px;vertical-align:middle;margin-right:4px}
a{color:var(--ac)}
</style></head><body><main><h1>비트코인 추세 현황판</h1><div class="upd" id="u">불러오는 중…</div><div id="root"></div>
<script>
const rp=location.hostname.split('.')[0]+'/'+location.pathname.split('/')[1];
const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pc=(v,n=1)=>v==null?'-':(v>0?'+':'')+Number(v).toFixed(n)+'%';
const cl=v=>v>0?'up':(v<0?'dn':'');
const won=v=>v==null?'-':Math.round(v).toLocaleString('ko-KR')+'원';
function chart(q){
  if(!q||q.d.length<2)return '<div class="mut">기록이 쌓이는 중이에요. 매일 오전 9시(한국) 이후 하루에 한 점씩 늘어납니다.</div>';
  const W=600,H=190,P=30,n=q.d.length,all=q.me.concat(q.bh),lo=Math.min(0,...all),hi=Math.max(0,...all),r=(hi-lo)||1;
  const X=i=>P+(W-P-8)*i/(n-1),Y=v=>8+(H-26)*(1-(v-lo)/r);
  const line=(a,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.2" points="${a.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${P}" x2="${W-8}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ln)"/>
  <text x="2" y="${Y(0)+4}" font-size="11" fill="var(--mut)">0%</text><text x="2" y="${Y(hi)+10}" font-size="11" fill="var(--mut)">${hi.toFixed(0)}%</text><text x="2" y="${Y(lo)}" font-size="11" fill="var(--mut)">${lo.toFixed(0)}%</text>
  ${line(q.bh,'var(--mut)')}${line(q.me,'var(--ac)')}
  <text x="${P}" y="${H-3}" font-size="11" fill="var(--mut)">${e(q.d[0])}</text><text x="${W-8}" y="${H-3}" font-size="11" text-anchor="end" fill="var(--mut)">${e(q.d[n-1])}</text></svg>
  <div class="lg"><span><i style="background:var(--ac)"></i>내 전략</span><span><i style="background:var(--mut)"></i>그냥 보유</span></div>`;
}
function draw(s){
  document.getElementById('u').textContent=`${s.mode} 매매 · 갱신 ${s.updated}`+(s.running?'':' · 봇이 꺼져 있어요');
  const sg=s.signals||[];
  const trip=s.round_trips;
  const trades=(s.trades||[]).slice().reverse();
  document.getElementById('root').innerHTML=
  `<div class="card"><div class="big">${e(s.judge||'판단 기록 없음')}</div>
   <div class="mut" style="margin-top:4px">전략: ${e(s.strategy)} · 마지막 판단일 ${e(s.last_day||'-')} · ${s.paused?'⏸ 일시정지':'매일 오전 9시(한국)에 판단'}</div>
   <div class="kv"><div>원금 대비<b class="${cl(s.ret_pct)}">${pc(s.ret_pct,2)}</b></div><div>같은 기간 그냥 보유<b class="${cl(s.bh_pct)}">${pc(s.bh_pct,2)}</b></div>
   <div>지금 비트코인 비중<b>${s.weight_pct==null?'-':s.weight_pct+'%'}</b></div><div>최대 낙폭 (자산)<b>${pc(s.mdd_pct,1)}</b></div></div></div>
   <h2>자산 추이 (원금 = 0%)</h2><div class="card">${chart(s.equity)}</div>
   <h2>매매 이력 <span class="pill">매매 ${(s.trades||[]).length}건</span><span class="pill">매수→매도 완료 ${trip}회</span></h2>
   <div class="card">`+(trades.length?`<table><tr><th>날짜(한국)</th><th>구분</th><th>체결가</th><th>결과</th></tr>`+trades.map(t=>`<tr><td>${e(t.ts)}</td><td class="${t.side==='buy'?'up':'dn'}">${t.side==='buy'?'매수':'매도'}</td><td>${won(t.price)}</td><td>${t.pnl==null?'<span class="mut">보유 중</span>':'<span class="'+cl(t.pnl)+'">'+pc(t.pnl,1)+'</span>'}</td></tr>`+(t.reason?`<tr><td colspan="4" class="mut" style="border:0;padding-top:0">${e(t.reason)}</td></tr>`:'')).join('')+`</table><div class="mut" style="margin-top:6px">결과는 가격 기준(수수료 제외)입니다. 매수는 '보유 중'으로 표시되고, 매도가 나오면 그 매수 대비 수익이 매도 줄에 찍힙니다.</div>`:'<div class="mut">아직 매매가 없어요</div>')+`</div>
   <h2>이동평균선 신호 (${e(s.asof||'')} 기준)</h2><div class="card">`+(sg.length?`<table><tr><th>기준</th><th>선 가격</th><th>현재가와 차이</th><th>판단</th></tr>`+sg.map(x=>`<tr${String(x.n)===String(s.strategy_n)?' style="font-weight:700"':''}><td>${x.n}일선${String(x.n)===String(s.strategy_n)?' ✔ 사용 중':''}</td><td>${won(x.ma)}</td><td class="${cl(x.gap)}">${pc(x.gap,1)}</td><td>${x.hold?'위 → 보유':'아래 → 현금'}</td></tr>`).join('')+`</table>`:'<div class="mut">신호를 불러오지 못했어요</div>')+`</div>
   <h2>월간 전략 점검 기록</h2><div class="card">`+((s.reviews||[]).length?s.reviews.map(r=>`<div class="rv"><b>${e(r.ts)}</b> · ${e(r.reason||'')}<pre>${e(r.detail||'')}</pre></div>`).join(''):'<div class="mut">아직 없음</div>')+`</div>
   <h2>이 봇의 규칙</h2><div class="card mut">매일 오전 9시(한국)에 일봉이 완성되면 종가가 ${e(s.strategy)}선 위면 비트코인 보유, 아래면 현금으로 둡니다. 매달 1일 지난 1년으로 점검해 더 나은 설정이 있으면 제안하고, 승인해야 바뀝니다. 자산이 고점 대비 -35%면 매수를 멈춥니다. 금액·수량은 이 페이지에 올리지 않고 %와 가격만 보여 줍니다. 투자 권유가 아닙니다.</div>
   <div class="mut" style="margin-top:12px"><a href="../">← 투자 허브로</a></div>`;
}
fetch('https://raw.githubusercontent.com/'+rp+'/data/btc.json?_='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(draw)
 .catch(()=>{document.getElementById('u').textContent='아직 데이터가 올라오지 않았어요 (허브가 켜져 있으면 5분 안에 올라옵니다)'});
</script></main></body></html>
