<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>투자 허브</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>:root{--bg:#eef1ec;--card:#fbfcf9;--tx:#22302a;--mut:#6c786f;--ln:#dde3db;--ac:#2f6b57;--acs:#e1ece5;--tile:#f1f4ef;--up:#cf4b3b;--dn:#3a6ccc;--warn:#c8553d;--note:#b98a2e;--ok:#3f8f6b;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--sh:0 1px 2px rgba(34,48,42,.04),0 6px 18px rgba(34,48,42,.05)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
main{max-width:660px;margin:0 auto;padding:28px 18px 72px}
button:focus-visible,a:focus-visible,[data-rc]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hd{margin:4px 2px 22px}.hb{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}.hb i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.hi{font-family:"Gowun Batang",serif;font-size:27px;line-height:1.35;font-weight:700;letter-spacing:-.02em;margin:0}
.hs{font-size:15px;color:var(--mut);margin-top:6px;max-width:34em}.hs b{color:var(--tx);font-weight:650}
.upd{color:var(--mut);font-size:12px;margin-top:10px;opacity:.85}
h1{display:none}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh)}

.today .nm{font-family:"Gowun Batang",serif;font-size:17px;margin-bottom:6px}
.today .it{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--ln);font-size:14px}
.today .it:first-of-type{border-top:0}
.today .it .lv{width:6px;height:6px;border-radius:50%;background:var(--note);transform:translateY(-2px)}.today .it.red .lv{background:var(--warn)}
.today .it b{font-weight:650;font-size:12.5px;color:var(--mut);display:block}.today .it .ms{grid-column:2}
.today .clear{font-size:15px;padding:6px 0;color:var(--tx)}
.bots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--ln)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;background:var(--tile);font-size:12.5px;color:var(--tx)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--mut)}.tag i.g{background:var(--ok)}.tag i.y{background:var(--note)}.tag i.r{background:var(--warn)}
.tabs{display:flex;gap:4px;margin:22px 0 14px;padding:4px;background:var(--tile);border:1px solid var(--ln);border-radius:14px}

.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(34,48,42,.12)}
.sub{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.sub::-webkit-scrollbar{display:none}
.sub button{flex:none;padding:7px 15px;border:1px solid var(--ln);background:var(--card);color:var(--mut);border-radius:99px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.sub button.on{background:var(--acs);color:var(--ac);border-color:transparent}
.ul{display:flex;gap:20px;border-bottom:1px solid var(--ln);margin:4px 2px 14px;overflow-x:auto;scrollbar-width:none}.ul::-webkit-scrollbar{display:none}
.ul button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:7px 0;margin-bottom:-1px;font:inherit;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer}
.ul button.on{color:var(--tx);border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font-size:13px;white-space:nowrap}.hl{color:var(--mut);font-size:13.5px;margin-top:4px}
h2{font-family:"Gowun Batang",serif;font-size:16px;margin:22px 4px 10px;color:var(--tx);font-weight:700}h2:first-child{margin-top:4px}h2 .md{font-family:"Pretendard Variable",Pretendard,sans-serif}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.kv div{background:var(--tile);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mut)}.kv b{display:block;color:var(--tx);font-size:15px;font-weight:650}
details{border-top:1px solid var(--ln);padding:8px 0}details:first-of-type{border-top:0}summary{cursor:pointer;font-weight:650;padding:4px 0}
.it{padding:8px 0 8px 2px;border-top:1px solid var(--ln)}.it:first-of-type{border-top:0}.sym{font-weight:650}.px{color:var(--mut);font-size:13px;margin-left:6px}.nt{color:var(--mut);font-size:12.5px;line-height:1.55}
a.card{display:block;color:inherit;text-decoration:none}a.card:hover{border-color:var(--ac)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two .card{margin:0}.li{display:flex;justify-content:space-between;gap:6px;font-size:13px;padding:4px 0}.li span:last-child{font-weight:650;white-space:nowrap}
.upc{color:var(--up)}.dnc{color:var(--dn)}
table.fl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}table.fl th,table.fl td{padding:6px 2px;text-align:right;border-top:1px solid var(--ln)}table.fl tr:first-child th{border-top:0}table.fl th:first-child,table.fl td:first-child{text-align:left}table.fl th{color:var(--mut);font-weight:600;font-size:12px}table.fl tr.sum td{font-weight:650}
.lcw{position:relative}.lct{position:absolute;display:none;pointer-events:none;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.12);white-space:nowrap;z-index:5}.lcg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin:2px 0 6px}.lcg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0;gap:2px}.bar i{display:block}
.rcx{cursor:pointer;border-radius:8px}.rcx:hover{background:var(--tile)}.rci{color:var(--ac);font-size:12px;font-weight:650;white-space:nowrap}
#rcm{position:fixed;inset:0;background:rgba(20,28,24,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}#rcm[hidden]{display:none}
#rcm .rcw{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:20px 20px 16px 16px;max-width:580px;width:100%;max-height:82vh;overflow:auto;padding:18px 20px 20px;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:up .22s ease-out}
#rcm .rcw .nm{font-family:"Gowun Batang",serif;font-size:17px;line-height:1.45}
#rcm .rcc{float:right;border:0;background:var(--tile);color:var(--mut);width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1;margin:-4px -6px 0 8px}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){#rcm .rcw{animation:none}}
@media(min-width:700px){#rcm{align-items:center}#rcm .rcw{border-radius:18px}main{padding-top:40px}.hi{font-size:30px}}
@media(max-width:420px){.kv{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
</style></head><body><main><div id="rcm" hidden><div class="rcw"><button class="rcc" aria-label="닫기">×</button><div class="rcb"></div></div></div><header class="hd"><div class="hb"><i></i>투자 허브</div><p class="hi" id="hi">안녕하세요</p><div class="hs" id="hs">오늘 상황을 불러오고 있어요</div><div class="upd" id="u"></div></header><div id="root"></div>
<script>
const rp=location.hostname.split('.')[0]+'/'+location.pathname.split('/')[1];
const I={"정상":"🟢","확인됨":"🟢","지연":"🟡","멈춤":"🔴","일시정지":"⏸","미가동":"⚪","오래됨":"🟡","읽기 실패":"🔴"};
const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let gid=0;
function tabs(items,cls){const g='g'+(gid++);return `<div class="${cls}">`+items.map((x,i)=>`<button data-g="${g}" data-i="${i}" class="${i?'':'on'}">${x[0]}</button>`).join('')+`</div>`+items.map((x,i)=>`<div class="pane" data-g="${g}" data-i="${i}"${i?' hidden':''}>${x[1]}</div>`).join('');}
document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-g]');if(!b)return;const g=b.dataset.g,i=b.dataset.i;
document.querySelectorAll(`[data-g="${g}"]`).forEach(el=>{if(el.tagName==='BUTTON')el.className=el.dataset.i===i?'on':'';else el.hidden=el.dataset.i!==i;});
try{history.replaceState(null,'','#'+(window._p=(window._p||{}),window._p[g]=i,Object.values(window._p).join('')))}catch(_){}});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-rc]');const m=document.getElementById('rcm');
if(t){const x=window._rc[+t.dataset.rc];m.querySelector('.rcb').innerHTML=`<div class="nm" style="margin-bottom:6px">${e(x.t)}</div>`+(x.why||[]).map(w=>`<div class="it">• ${e(w)}</div>`).join('')+((x.src||[]).length?`<div class="nm" style="margin:12px 0 4px">근거 글 <span class="md">구독자 로그인 필요</span></div>`+x.src.map(s=>`<a class="it" style="display:block;color:var(--ac);text-decoration:none" href="${e(s.u)}" target="_blank" rel="noopener">${e(s.d)} · ${e(s.t)} ↗</a>`).join(''):'');m.hidden=false;return;}
if(m&&!m.hidden&&(ev.target===m||ev.target.closest('.rcc')))m.hidden=true;});
const card=b=>`<${b.url?'a href="'+e(b.url)+'"':'div'} class="card"><div class="row"><div><span class="nm">${e(b.name)}</span><span class="md">${e(b.mode||'')}</span></div><div class="st">${I[b.state]||'⚪'} ${e(b.state)}</div></div><div class="hl">${e(b.headline||'')}${b.url?' · 자세히 ›':''}</div></${b.url?'a':'div'}>`;
const kv=(k,v)=>`<div>${k}<b>${v==null?'-':v}</b></div>`;
const pc=v=>(v>0?'+':'')+v+'%';const cl=v=>v>0?'upc':v<0?'dnc':'';
function usmarket(a){if(!a)return '<div class="card nt">자료 없음</div>';const G=a.grade,tot=a.n;const col={"강한 매수":'#0e9f6e',"매수":'#7bc7a4',"중립":'#b7bdc8',"매도":'#f0a39b',"강한 매도":'#d92d20'};
const li=l=>l.map(x=>`<div class="li"><span>${e(x.sym)} <span class="md">${e(x.name)}</span></span><span class="${cl(x.d1)}">${pc(x.d1)}</span></div>`).join('')||'<div class="nt">없음</div>';
const rs=l=>l.map(x=>`<div class="li"><span>${e(x.sym)} <span class="md">${e(x.name)}</span></span><span>RSI ${x.rsi}</span></div>`).join('')||'<div class="nt">없음</div>';
return `<h2>시장 개요 <span class="md">${e(a.asof)} 종가 · ${a.n.toLocaleString()}종목 스캔</span></h2>
<div class="card"><div class="kv">${kv('상승 종목 비율',a.up_pct+'%')}${kv('평균 RSI',a.avg_rsi)}${kv('강한 매수 등급',G['강한 매수']+'개')}</div>
<div class="bar">${Object.keys(G).map(k=>`<i style="width:${G[k]*100/tot}%;background:${col[k]}"></i>`).join('')}</div>
<div class="nt">${Object.keys(G).map(k=>`<span style="color:${col[k]}">●</span> ${k} ${G[k]}`).join(' · ')}</div></div>
<h2>오늘 많이 움직인 종목 <span class="md">시총 상위 300 중</span></h2>
<div class="two"><div class="card"><div class="nm" style="font-size:13px">상승 TOP</div>${li(a.up)}</div><div class="card"><div class="nm" style="font-size:13px">하락 TOP</div>${li(a.down)}</div></div>
<h2>RSI 과열 · 과매도 <span class="md">시총 상위 300 중</span></h2>
<div class="two"><div class="card"><div class="nm" style="font-size:13px">과매도 (RSI&lt;30)</div>${rs(a.oversold)}</div><div class="card"><div class="nm" style="font-size:13px">과열 (RSI&gt;70)</div>${rs(a.overbought)}</div></div>
`+(a.signals&&a.signals.length?`<h2>오늘 나온 매수 신호 <span class="md">시총 상위 150 중</span></h2><div class="card">${a.signals.map(x=>`<div class="it"><span class="sym">${e(x.sym)}</span> <span class="px">${e(x.name)}</span><div class="nt">${x.hits.map(e).join(' · ')}</div></div>`).join('')}</div>`:'');}
function usrec(a){if(!a||a.error)return '<div class="card nt">자료 없음</div>';
return `<h2>AI·반도체 차트 <span class="md">${e(a.asof)} 기준</span></h2>`+(a.hot?`<div class="card"><div class="hl">📌 돈이 몰리는 곳: ${e(a.hot)}</div><div class="hl">📌 힘이 빠진 곳: ${e(a.cold)}</div></div>`:'')+
`<div class="card">${a.groups.map((g,i)=>`<details${i===0?' open':''}><summary>${e(g.label)} <span class="md">${g.items.length}개</span></summary>${g.items.map(x=>`<div class="it"><span class="sym">${e(x.sym)}</span> <span>${e(x.name)}</span><span class="px">${e(x.price)}</span>${x.note.map(n=>`<div class="nt">${e(n)}</div>`).join('')}</div>`).join('')}</details>`).join('')}</div>`+
(a.watch&&a.watch.length?`<h2>내 관심 종목</h2><div class="card">${a.watch.map(x=>`<div class="it"><span class="sym">${e(x.sym)}</span> <span>${e(x.label)}</span></div>`).join('')}</div>`:'');}

const err=a=>a&&a.error?`<div class="card nt">불러오지 못했어요 (${e(a.error)})</div>`:null;
const LC={};
function lc(o){const id='lc'+Object.keys(LC).length,CW=Math.max(290,Math.min(580,(document.documentElement.clientWidth||380)-64)),W=CW,H=o.H||250,L=o.L||46,R=o.R||12,T=o.T||10,B=o.B||26;
const xs=o.x,ys=o.y,lg=ys.log?Math.log10:(v=>v);
const X=v=>L+(v-xs.min)/(xs.max-xs.min)*(W-L-R),Y=v=>T+(1-(lg(v)-lg(ys.min))/(lg(ys.max)-lg(ys.min)))*(H-T-B);
const f=(v)=>(+v).toFixed(1);let g='';
(o.bands||[]).forEach(b=>{g+=`<rect x="${f(X(b.x0))}" y="${T}" width="${f(X(b.x1)-X(b.x0))}" height="${H-T-B}" fill="${b.c||'var(--s4)'}" opacity=".14"/>`+(b.t?`<text x="${f((X(b.x0)+X(b.x1))/2)}" y="${T+13}" text-anchor="middle" font-size="11" fill="var(--mut)">${b.t}</text>`:'')});
ys.ticks.forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${f(Y(v))}" y2="${f(Y(v))}" stroke="var(--ln)" stroke-width="1"/><text x="${L-6}" y="${f(Y(v)+4)}" text-anchor="end" font-size="11" fill="var(--mut)">${ys.fmt?ys.fmt(v):v}</text>`});
xs.ticks.forEach(v=>{g+=`<text x="${f(X(v))}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mut)">${xs.fmt?xs.fmt(v):v}</text>`});
(o.vlines||[]).forEach(v=>{g+=`<line x1="${f(X(v.x))}" x2="${f(X(v.x))}" y1="${T}" y2="${H-B}" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="4 3"/>`+(v.t?`<text x="${f(X(v.x)+5)}" y="${H-B-6}" font-size="11" fill="var(--mut)">${v.t}</text>`:'')});
(o.hlines||[]).forEach(h=>{g+=`<line x1="${L}" x2="${W-R}" y1="${f(Y(h.y))}" y2="${f(Y(h.y))}" stroke="${h.c||'var(--mut)'}" stroke-width="1.3" stroke-dasharray="${h.solid?'0':'5 4'}"/>`+(h.t?`<text x="${W-R-3}" y="${f(Y(h.y)-5)}" text-anchor="end" font-size="11" fill="var(--tx)">${h.t}</text>`:'')});
o.series.forEach(s=>{let d='',on=false;s.pts.forEach(p=>{if(p[1]==null){on=false;return}d+=(on?'L':'M')+f(X(p[0]))+' '+f(Y(Math.max(ys.min,Math.min(ys.max,p[1]))));on=true});g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`});
(o.marks||[]).forEach(m=>{g+=`<circle cx="${f(X(m.x))}" cy="${f(Y(m.y))}" r="${m.r||4.5}" fill="${m.c}" stroke="var(--card)" stroke-width="2"/>`+(m.t?`<text x="${f(X(m.x)+(m.dx==null?0:m.dx))}" y="${f(Y(m.y)+(m.dy==null?-9:m.dy))}" text-anchor="${m.a||'middle'}" font-size="11" font-weight="700" fill="var(--tx)">${m.t}</text>`:'')});

g+=`<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" style="touch-action:pan-y" onpointermove="lcM(event,'${id}')" onpointerdown="lcM(event,'${id}')" onpointerleave="lcH('${id}')"/>`;

function lcH(id){['x'].concat(LC[id].o.series.map((s,i)=>'d'+i)).forEach(k=>{const n=document.getElementById(id+k);if(n)n.style.display='none'});document.getElementById(id+'t').style.display='none'}
function lcM(ev,id){const c=LC[id],o=c.o,r=ev.currentTarget.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*(c.W-c.L-c.R)+c.L,xv=o.x.min+(px-c.L)/(c.W-c.L-c.R)*(o.x.max-o.x.min);
let best=null;o.series.forEach(s=>s.pts.forEach(p=>{if(p[1]!=null&&(best==null||Math.abs(p[0]-xv)<Math.abs(best-xv)))best=p[0]}));if(best==null)return;
const X=c.X(best);const ln=document.getElementById(id+'x');ln.setAttribute('x1',X);ln.setAttribute('x2',X);ln.style.display='';

function tsla(a,url){const lk=url?`<a class="card" href="${e(url)}"><div class="row"><div class="nm">테슬라 플랜 상세 페이지</div><div class="st">열기 ›</div></div><div class="hl">3분할 매수 플랜과 근거 전체</div></a>`:'';if(!a)return lk+'<div class="card nt">자료 없음</div>';const L=a.lines||{};const dir=(a.close&&L.hi20)?((a.close/L.hi20-1)*100).toFixed(1)+'%':'-';
return lk+`<div class="card"><div class="nm">오늘의 판단 <span class="md">${e(a.day)} 종가 기준</span></div><div class="hl" style="font-size:14px;color:var(--tx)">${e(a.why)}</div>
<div class="kv">${kv('종가','$'+a.close)}${kv('20일선','$'+L.m20)}${kv('60일선','$'+L.m60)}${kv('200일선','$'+L.m200)}${kv('돌파선(20일 최고)','$'+L.hi20)}${kv('손절선(10일 최저)','$'+L.lo10)}</div>
<div class="hl">종가가 돌파선보다 ${dir} · 변동성 ${a.vol_pct}% · 목표 배수 ${a.target}배</div>
<div style="margin-top:8px">${(a.tranches||[]).map(t=>`<span class="tag">${e(t.date)} 매수회차 ${t.status==='wait'?'대기':e(t.status)}</span>`).join('')}</div></div>`;}
function krflow(a){if(!a)return '<div class="card nt">자료 없음</div>';
const tb=(mk,m)=>{const r=m.days;return `<div class="card"><div class="nm">${mk} 투자자별 순매수 <span class="md">억 원 · 최근 ${r.length}거래일</span></div><table class="fl"><tr><th></th><th>개인</th><th>외국인</th><th>기관</th></tr>`+
r.map(d=>`<tr><td>${e(d.date)}</td><td class="${cl(d.ind)}">${d.ind.toLocaleString()}</td><td class="${cl(d.frg)}">${d.frg.toLocaleString()}</td><td class="${cl(d.ins)}">${d.ins.toLocaleString()}</td></tr>`).join('')+
`<tr class="sum"><td>5일 합</td><td class="${cl(m.sum5.ind)}">${m.sum5.ind.toLocaleString()}</td><td class="${cl(m.sum5.frg)}">${m.sum5.frg.toLocaleString()}</td><td class="${cl(m.sum5.ins)}">${m.sum5.ins.toLocaleString()}</td></tr>`+
`<tr class="sum"><td>20일 합</td><td class="${cl(m.sum20.ind)}">${m.sum20.ind.toLocaleString()}</td><td class="${cl(m.sum20.frg)}">${m.sum20.frg.toLocaleString()}</td><td class="${cl(m.sum20.ins)}">${m.sum20.ins.toLocaleString()}</td></tr></table></div>`};
return Object.keys(a).map(k=>tb(k,a[k])).join('');}
function krstock(a){if(!a||a.error)return '<div class="card nt">자료 없음</div>';
return `<div class="card"><div class="nm">관심 종목 등급</div>${a.rating.map(x=>`<div class="it"><span class="sym">${e(x.name||x.sym)}</span><span class="px">${e(x.sym)}</span> <span>${e(x.label)}</span></div>`).join('')}</div>`+
(a.reentry.length?`<div class="card"><div class="nm">재진입 조건</div>${a.reentry.map(x=>`<div class="it"><span class="sym">${e(x.name||x.sym)}</span> <span>${x.on?'🟢 충족':'⚪ 미충족'}</span><div class="nt">${e(x.detail)}</div></div>`).join('')}</div>`:'');}
function rcb(r){if(!r||r.error)return '<div class="card nt">자료 없음</div>';
window._rc=[];const L=(a,b='•')=>(a||[]).map(x=>{if(typeof x==='string')return `<div class="it">${b} ${e(x)}</div>`;const i=window._rc.push(x)-1;return `<div class="it rcx" data-rc="${i}">${b} ${e(x.t)} <span class="rci">근거 ›</span></div>`}).join('');
const sum=`<div class="card"><div class="nm">한눈에 <span class="md">${e(r.asof)} 기준</span></div>${L(r.oneline)}</div>`+
(r.week?`<div class="card"><div class="nm">최근 요약 <span class="md">${e(r.week.range)}</span></div>${L(r.week.p)}</div>`:'');
const mon=(r.months||[]).map(m=>`<div class="card"><div class="nm">${e(m.m)} <span class="md">${e(m.t)}</span></div>${L(m.p)}</div>`).join('');
const dir=`<div class="card"><div class="nm">중장기 방향</div>${L(r.direction)}</div><div class="card"><div class="nm">체크 지표</div>${L(r.watch)}</div>`+
`<div class="card"><div class="nm">적중 / 빗나감</div>${L(r.hits,'✅')}${L(r.misses,'❌')}<div class="nt">${e(r.src||'')}</div></div>`;
return tabs([['요약',sum],['월별',mon],['방향',dir]],'ul');}
fetch('https://raw.githubusercontent.com/'+rp+'/data/hub.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(s=>{
document.getElementById('u').textContent=s.ts+' 기준으로 5분마다 새로 고쳐져요';
const B=Object.fromEntries(s.bots.map(b=>[b.id,b]));const A=s.analysis||{};
const st=B.stock&&B.stock.age_min!=null?`<div class="nt" style="margin-top:6px">주식 분석 봇 마지막 갱신 ${B.stock.age_min}분 전</div>`:'';
const analysis=tabs([['🇺🇸 미국',tabs([['시장',usmarket(A.usscan)],['추천',usrec(A.us)],['테슬라',tsla(A.tsla,B.tsla&&B.tsla.url)]],'ul')+st],['🇰🇷 한국',tabs([['수급',krflow(A.krflow)],['종목',krstock(A.kr)]],'ul')+st],['🪙 코인',tabs([['시장',coinmarket(A.coin&&A.coin.market)],['김프',coinkimp(A.coin&&A.coin.kimp)],['전략',coinstrat(A.coin&&A.coin.strategy)],['구간',coinregime(A.coin&&A.coin.regime)+coincycle(A.coin&&A.coin.cycle)+coinmacro(A.coin&&A.coin.macro)]],'ul')],['🐔 치킨보이',rcb(A.rcb)]],'sub');
const auto=['kimp','btc'].filter(k=>B[k]).map(k=>{const b=B[k];const t=b.ret_pct!=null?`<div class="kv" style="margin:-4px 0 10px">${kv('원금 대비',(b.ret_pct>0?'+':'')+b.ret_pct+'%')}${kv(k==='btc'?'매매 기록':'완료 거래',b.trades==null?'-':b.trades+'회')}${kv('포지션',e(b.position||'-'))}</div>`:'';return card(b)+t}).join('');
const td=s.todo||[];const dc=st=>({"정상":"g","확인됨":"g","지연":"y","일시정지":"y","오래됨":"y","멈춤":"r","읽기 실패":"r"}[st]||'');
const dots=s.bots.map(b=>`<span class="tag" title="${e(b.state)}"><i class="${dc(b.state)}"></i>${e(b.name)}</span>`).join('');
const red=td.filter(t=>t.lvl==='red').length,okb=s.bots.filter(b=>dc(b.state)==='g').length;
const hr=+(s.ts||'').slice(11,13);document.getElementById('hi').textContent=hr>=5&&hr<11?'좋은 아침이에요':hr>=11&&hr<17?'좋은 오후예요':hr>=17&&hr<22?'좋은 저녁이에요':'늦은 시간까지 수고 많아요';
document.getElementById('hs').innerHTML=`봇 ${s.bots.length}개 중 <b>${okb}개</b>가 잘 돌고 있어요. `+(td.length?`살펴볼 일이 <b>${td.length}개</b> 있어요${red?`, 그중 ${red}개는 먼저 봐 주세요`:''}.`:'오늘은 따로 챙길 일이 없어요.');
const top=`<div class="card today"><div class="nm">오늘 살펴볼 것</div>`+(td.length?td.map(t=>`<div class="it ${t.lvl==='red'?'red':''}"><span class="lv"></span><b>${e(t.bot)}</b><span class="ms">${e(t.msg)}</span></div>`).join(''):`<div class="clear">따로 챙길 일이 없어요. 편하게 보셔도 돼요.</div>`)+`<div class="bots">${dots}</div></div>`;
document.getElementById('root').innerHTML=top+tabs([['전략분석',analysis],['자동매매',auto]],'tabs');
}).catch(()=>{document.getElementById('hs').textContent='데이터를 불러오지 못했어요. 허브 프로그램(start_hub.bat)이 켜져 있는지 확인해 주세요.'});
</script></main></body></html>
