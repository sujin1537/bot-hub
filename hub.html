<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>투자 허브</title><style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#161a21;--mut:#6b7280;--ln:#e5e7eb;--ac:#2563eb;--tile:#f0f2f5;--up:#d92d20;--dn:#1d6fe8}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--card:#1a1b1e;--tx:#e9ecf1;--mut:#9aa3b2;--ln:#2a2d33;--ac:#5b8def;--tile:#22252b;--up:#ff6b5e;--dn:#6aa8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 56px}h1{font-size:19px;margin:0 0 2px;letter-spacing:-.2px}.upd{color:var(--mut);font-size:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px 0;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:650;cursor:pointer}.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sub{display:flex;gap:6px;margin:0 0 10px}.sub button{padding:6px 14px;border:1px solid var(--ln);background:var(--card);color:var(--mut);border-radius:99px;font:inherit;font-size:13px;font-weight:650;cursor:pointer}.sub button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.ul{display:flex;gap:18px;border-bottom:1px solid var(--ln);margin:2px 0 12px}.ul button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0;margin-bottom:-1px;font:inherit;font-size:14px;font-weight:650;color:var(--mut);cursor:pointer}.ul button.on{color:var(--tx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.nm{font-weight:650}.md{color:var(--mut);font-size:12px;margin-left:6px;font-weight:400}
.st{font-size:13px;white-space:nowrap}.hl{color:var(--mut);font-size:13px;margin-top:4px}
h2{font-size:14px;margin:14px 2px 8px;color:var(--mut);font-weight:650}h2:first-child{margin-top:2px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.kv div{background:var(--tile);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--mut)}.kv b{display:block;color:var(--tx);font-size:14px}
details{border-top:1px solid var(--ln);padding:6px 0}details:first-of-type{border-top:0}summary{cursor:pointer;font-weight:650;padding:4px 0}
.it{padding:6px 0 6px 2px;border-top:1px dashed var(--ln)}.it:first-of-type{border-top:0}.sym{font-weight:650}.px{color:var(--mut);font-size:13px;margin-left:6px}.nt{color:var(--mut);font-size:12.5px}
a.card{display:block;color:inherit;text-decoration:none}.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--tile);font-size:12px;margin:0 4px 4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .card{margin:0}.li{display:flex;justify-content:space-between;gap:6px;font-size:13px;padding:3px 0}.li span:last-child{font-weight:650;white-space:nowrap}
.upc{color:var(--up)}.dnc{color:var(--dn)}table.fl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}table.fl th,table.fl td{padding:4px 2px;text-align:right}table.fl th:first-child,table.fl td:first-child{text-align:left}table.fl th{color:var(--mut);font-weight:600}table.fl tr.sum td{border-top:1px solid var(--ln);font-weight:650}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block}
</style></head><body><main><h1>투자 허브</h1><div class="upd" id="u">불러오는 중…</div><div id="root"></div>
<script>
const rp=location.hostname.split('.')[0]+'/'+location.pathname.split('/')[1];
const I={"정상":"🟢","확인됨":"🟢","지연":"🟡","멈춤":"🔴","일시정지":"⏸","미가동":"⚪","오래됨":"🟡","읽기 실패":"🔴"};
const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let gid=0;
function tabs(items,cls){const g='g'+(gid++);return `<div class="${cls}">`+items.map((x,i)=>`<button data-g="${g}" data-i="${i}" class="${i?'':'on'}">${x[0]}</button>`).join('')+`</div>`+items.map((x,i)=>`<div class="pane" data-g="${g}" data-i="${i}"${i?' hidden':''}>${x[1]}</div>`).join('');}
document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-g]');if(!b)return;const g=b.dataset.g,i=b.dataset.i;
document.querySelectorAll(`[data-g="${g}"]`).forEach(el=>{if(el.tagName==='BUTTON')el.className=el.dataset.i===i?'on':'';else el.hidden=el.dataset.i!==i;});
try{history.replaceState(null,'','#'+(window._p=(window._p||{}),window._p[g]=i,Object.values(window._p).join('')))}catch(_){}});
const card=b=>`<${b.url?'a href="'+e(b.url)+'"':'div'} class="card"><div class="row"><div><span class="nm">${e(b.name)}</span><span class="md">${e(b.mode||'')}</span></div><div class="st">${I[b.state]||'⚪'} ${e(b.state)}</div></div><div class="hl">${e(b.headline||'')}${b.url?' · 자세히 ›':''}</div></${b.url?'a':'div'}>`;
const kv=(k,v)=>`<div>${k}<b>${v==null?'-':v}</b></div>`;
const pc=v=>(v>0?'+':'')+v+'%';const cl=v=>v>0?'upc':v<0?'dnc':'';
function usmarket(a){if(!a)return '<div class="card nt">자료 없음</div>';const G=a.grade,tot=a.n;const col={"강한 매수":'#0e9f6e',"매수":'#7bc7a4',"중립":'#b7bdc8',"매도":'#f0a39b',"강한 매도":'#d92d20'};
const li=l=>l.map(x=>`<div class="li"><span>${e(x.sym)} <span class="md">${e(x.name)}</span></span><span class="${cl(x.d1)}">${pc(x.d1)}</span></div>`).join('')||'<div class="nt">없음</div>';
const rs=l=>l.map(x=>`<div class="li"><span>${e(x.sym)} <span class="md">${e(x.name)}</span></span><span>RSI ${x.rsi}</span></div>`).join('')||'<div class="nt">없음</div>';
return `<h2>시장 개요 <span class="md">${e(a.asof)} 종가 · ${a.n.toLocaleString()}종목 스캔</span></h2>
<div class="card"><div class="kv">${kv('상승 종목 비율',a.up_pct+'%')}${kv('평균 RSI',a.avg_rsi)}${kv('강한 매수 등급',G['강한 매수']+'개')}</div>
<div class="bar">${Object.keys(G).map(k=>`<i style="width:${G[k]*100/tot}%;background:${col[k]}"></i>`).join('')}</div>
<div class="nt">${Object.keys(G).map(k=>`<span style="color:${col[k]}">●</span> ${k} ${G[k]}`).join(' · ')}</div></div>
<h2>오늘 많이 움직인 종목 <span class="md">시총 상위 300 중</span></h2>
<div class="two"><div class="card"><div class="nm" style="font-size:13px">상승 TOP</div>${li(a.up)}</div><div class="card"><div class="nm" style="font-size:13px">하락 TOP</div>${li(a.down)}</div></div>
<h2>RSI 과열 · 과매도 <span class="md">시총 상위 300 중</span></h2>
<div class="two"><div class="card"><div class="nm" style="font-size:13px">과매도 (RSI&lt;30)</div>${rs(a.oversold)}</div><div class="card"><div class="nm" style="font-size:13px">과열 (RSI&gt;70)</div>${rs(a.overbought)}</div></div>
`+(a.signals&&a.signals.length?`<h2>오늘 나온 매수 신호 <span class="md">시총 상위 150 중</span></h2><div class="card">${a.signals.map(x=>`<div class="it"><span class="sym">${e(x.sym)}</span> <span class="px">${e(x.name)}</span><div class="nt">${x.hits.map(e).join(' · ')}</div></div>`).join('')}</div>`:'');}
function usrec(a){if(!a||a.error)return '<div class="card nt">자료 없음</div>';
return `<h2>AI·반도체 차트 <span class="md">${e(a.asof)} 기준</span></h2>`+(a.hot?`<div class="card"><div class="hl">📌 돈이 몰리는 곳: ${e(a.hot)}</div><div class="hl">📌 힘이 빠진 곳: ${e(a.cold)}</div></div>`:'')+
`<div class="card">${a.groups.map((g,i)=>`<details${i===0?' open':''}><summary>${e(g.label)} <span class="md">${g.items.length}개</span></summary>${g.items.map(x=>`<div class="it"><span class="sym">${e(x.sym)}</span> <span>${e(x.name)}</span><span class="px">${e(x.price)}</span>${x.note.map(n=>`<div class="nt">${e(n)}</div>`).join('')}</div>`).join('')}</details>`).join('')}</div>`+
(a.watch&&a.watch.length?`<h2>내 관심 종목</h2><div class="card">${a.watch.map(x=>`<div class="it"><span class="sym">${e(x.sym)}</span> <span>${e(x.label)}</span></div>`).join('')}</div>`:'');}

const err=a=>a&&a.error?`<div class="card nt">불러오지 못했어요 (${e(a.error)})</div>`:null;
function spark(a,L){const W=340,H=96,vs=a.concat(L.map(l=>l.v)),mn=Math.min(...vs),mx=Math.max(...vs),y=v=>H-8-(v-mn)/((mx-mn)||1)*(H-16),x=i=>i*(W/(a.length-1));
return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><polyline fill="none" stroke="var(--ac)" stroke-width="1.8" points="${a.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`+
L.map(l=>`<line x1="0" x2="${W}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.c}" stroke-width="1" stroke-dasharray="4 3"/><text x="${W-2}" y="${y(l.v)-3}" text-anchor="end" font-size="9" fill="${l.c}">${l.t} ${l.v}%</text>`).join('')+`</svg>`;}
function coinmarket(a){const x=err(a);if(x)return x;const b=a.btc||{};
const li=l=>l.map(r=>`<div class="li"><span>${e(r.sym)} <span class="md">${e(r.name)}</span></span><span class="${cl(r.chg)}">${pc(r.chg)}</span></div>`).join('');
const tr=Object.keys(a.trend||{}).map(n=>`<tr><td>${n}일선</td><td>${Math.round(a.trend[n].ma/1e4).toLocaleString()}만</td><td class="${cl(a.trend[n].gap)}">${pc(a.trend[n].gap)}</td><td>${a.trend[n].gap>0?'위':'아래'}</td></tr>`).join('');
return `<h2>비트코인 <span class="md">업비트 · 일봉 이동평균은 빗썸 기준</span></h2><div class="card"><div class="kv">${kv('현재가',b.px?Math.round(b.px/1e4).toLocaleString()+'만':'-')}${kv('24시간',b.chg==null?'-':pc(b.chg))}${kv('RSI(14일)',a.rsi==null?'-':a.rsi)}</div>
<table class="fl"><tr><th>이동평균</th><th>값</th><th>현재가 대비</th><th></th></tr>${tr}</table></div>
<h2>업비트 시장 <span class="md">원화 ${a.n}종목</span></h2><div class="card"><div class="kv">${kv('거래대금 상위 50 중 상승',a.up_pct+'%')}${kv('평균 등락',pc(a.avg_chg))}${kv('종목 수',a.n)}</div></div>
<h2>24시간 거래대금 TOP10 <span class="md">억 원</span></h2><div class="card">${a.top_amt.map(r=>`<div class="li"><span>${e(r.sym)} <span class="md">${e(r.name)}</span></span><span>${r.amt.toLocaleString()} <span class="${cl(r.chg)}">${pc(r.chg)}</span></span></div>`).join('')}</div>
<h2>많이 움직인 코인 <span class="md">거래대금 상위 50 중</span></h2><div class="two"><div class="card"><div class="nm" style="font-size:13px">상승 TOP</div>${li(a.up)}</div><div class="card"><div class="nm" style="font-size:13px">하락 TOP</div>${li(a.down)}</div></div>`;}
function coinkimp(a){const x=err(a);if(x)return x;if(!a)return '<div class="card nt">자료 없음</div>';
const msg=a.below_entry&&a.vol_ok?'🟢 진입 조건 충족 (기준선보다 낮고 변동성도 충분)':!a.vol_ok?`⚪ 변동성이 ${a.sd}%p로 진입 기준(0.33%p)보다 낮아 지금은 진입하지 않아요`:`⚪ 아직 진입선(${a.entry}%)까지 내려오지 않았어요`;
return `<h2>김치 프리미엄 <span class="md">최근 24시간</span></h2><div class="card"><div class="nm" style="font-size:15px">${msg}</div>
<div class="kv">${kv('현재 김프',a.cur+'%')}${kv('24시간 기준선',a.base+'%')}${kv('변동성(σ)',a.sd+'%p')}${kv('진입선',a.entry+'%')}${kv('청산선',a.exit+'%')}${kv('기준 대비',(a.gap_now>0?'+':'')+a.gap_now+'%p')}</div>
<div style="margin-top:10px">${spark(a.spark,[{v:a.exit,c:'#e8590c',t:'청산'},{v:a.base,c:'#8a94a6',t:'기준'},{v:a.entry,c:'#0e9f6e',t:'진입'}])}</div>
<div class="nt">진입 규칙: 기준선보다 0.25%p 낮고 변동성이 0.33%p 이상일 때 (김프봇 설정 기준)</div></div>`;}
function coinstrat(a){const x=err(a);if(x)return x;if(!a)return '<div class="card nt">자료 없음</div>';
return `<h2>이동평균 신호 <span class="md">${e(a.asof)} 일봉 종가 기준</span></h2><div class="card"><div class="nt">종가가 이동평균 위면 보유, 아래면 현금 (비트봇 규칙)</div><table class="fl"><tr><th>이동평균</th><th>값</th><th>현재가 대비</th><th>신호</th></tr>`+
a.signals.map(r=>`<tr><td>${r.n}일</td><td>${Math.round(r.ma/1e4).toLocaleString()}만</td><td class="${cl(r.gap)}">${pc(r.gap)}</td><td>${r.hold?'🟢 보유':'⚪ 현금'}</td></tr>`).join('')+`</table></div>
<h2>지난 1년 성과 순위 <span class="md">점수 높은 순 · 그냥 보유 ${pc(a.buyhold)}</span></h2><div class="card">`+a.ranked.map((r,i)=>`<div class="it"><span class="sym">${i+1}. ${e(r.name)}</span><div class="nt">수익 ${pc(r.ret)} · 낙폭 ${r.mdd}% · 매매 ${r.trades}회 · 점수 ${r.score}</div></div>`).join('')+`</div>`;}
function tsla(a,url){const lk=url?`<a class="card" href="${e(url)}"><div class="row"><div class="nm">테슬라 플랜 상세 페이지</div><div class="st">열기 ›</div></div><div class="hl">3분할 매수 플랜과 근거 전체</div></a>`:'';if(!a)return lk+'<div class="card nt">자료 없음</div>';const L=a.lines||{};const dir=(a.close&&L.hi20)?((a.close/L.hi20-1)*100).toFixed(1)+'%':'-';
return lk+`<div class="card"><div class="nm">오늘의 판단 <span class="md">${e(a.day)} 종가 기준</span></div><div class="hl" style="font-size:14px;color:var(--tx)">${e(a.why)}</div>
<div class="kv">${kv('종가','$'+a.close)}${kv('20일선','$'+L.m20)}${kv('60일선','$'+L.m60)}${kv('200일선','$'+L.m200)}${kv('돌파선(20일 최고)','$'+L.hi20)}${kv('손절선(10일 최저)','$'+L.lo10)}</div>
<div class="hl">종가가 돌파선보다 ${dir} · 변동성 ${a.vol_pct}% · 목표 배수 ${a.target}배</div>
<div style="margin-top:8px">${(a.tranches||[]).map(t=>`<span class="tag">${e(t.date)} 매수회차 ${t.status==='wait'?'대기':e(t.status)}</span>`).join('')}</div></div>`;}
function krflow(a){if(!a)return '<div class="card nt">자료 없음</div>';
const tb=(mk,m)=>{const r=m.days;return `<div class="card"><div class="nm">${mk} 투자자별 순매수 <span class="md">억 원 · 최근 ${r.length}거래일</span></div><table class="fl"><tr><th></th><th>개인</th><th>외국인</th><th>기관</th></tr>`+
r.map(d=>`<tr><td>${e(d.date)}</td><td class="${cl(d.ind)}">${d.ind.toLocaleString()}</td><td class="${cl(d.frg)}">${d.frg.toLocaleString()}</td><td class="${cl(d.ins)}">${d.ins.toLocaleString()}</td></tr>`).join('')+
`<tr class="sum"><td>5일 합</td><td class="${cl(m.sum5.ind)}">${m.sum5.ind.toLocaleString()}</td><td class="${cl(m.sum5.frg)}">${m.sum5.frg.toLocaleString()}</td><td class="${cl(m.sum5.ins)}">${m.sum5.ins.toLocaleString()}</td></tr>`+
`<tr class="sum"><td>20일 합</td><td class="${cl(m.sum20.ind)}">${m.sum20.ind.toLocaleString()}</td><td class="${cl(m.sum20.frg)}">${m.sum20.frg.toLocaleString()}</td><td class="${cl(m.sum20.ins)}">${m.sum20.ins.toLocaleString()}</td></tr></table></div>`};
return Object.keys(a).map(k=>tb(k,a[k])).join('');}
function krstock(a){if(!a||a.error)return '<div class="card nt">자료 없음</div>';
return `<div class="card"><div class="nm">관심 종목 등급</div>${a.rating.map(x=>`<div class="it"><span class="sym">${e(x.name||x.sym)}</span><span class="px">${e(x.sym)}</span> <span>${e(x.label)}</span></div>`).join('')}</div>`+
(a.reentry.length?`<div class="card"><div class="nm">재진입 조건</div>${a.reentry.map(x=>`<div class="it"><span class="sym">${e(x.name||x.sym)}</span> <span>${x.on?'🟢 충족':'⚪ 미충족'}</span><div class="nt">${e(x.detail)}</div></div>`).join('')}</div>`:'');}
fetch('https://raw.githubusercontent.com/'+rp+'/data/hub.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(s=>{
document.getElementById('u').textContent='갱신 '+s.ts+' (KST) · 금액·수량·보유 종목은 공개하지 않음';
const B=Object.fromEntries(s.bots.map(b=>[b.id,b]));const A=s.analysis||{};
const st=B.stock&&B.stock.age_min!=null?`<div class="nt" style="margin-top:6px">주식 분석 봇 마지막 갱신 ${B.stock.age_min}분 전</div>`:'';
const analysis=tabs([['🇺🇸 미국',tabs([['시장',usmarket(A.usscan)],['추천',usrec(A.us)],['테슬라',tsla(A.tsla,B.tsla&&B.tsla.url)]],'ul')+st],['🇰🇷 한국',tabs([['수급',krflow(A.krflow)],['종목',krstock(A.kr)]],'ul')+st],['🪙 코인',tabs([['시장',coinmarket(A.coin&&A.coin.market)],['김프',coinkimp(A.coin&&A.coin.kimp)],['전략',coinstrat(A.coin&&A.coin.strategy)]],'ul')]],'sub');
const auto=['kimp','btc'].filter(k=>B[k]).map(k=>{const b=B[k];const t=b.ret_pct!=null?`<div class="kv" style="margin:-4px 0 10px">${kv('원금 대비',(b.ret_pct>0?'+':'')+b.ret_pct+'%')}${kv(k==='btc'?'매매 기록':'완료 거래',b.trades==null?'-':b.trades+'회')}${kv('포지션',e(b.position||'-'))}</div>`:'';return card(b)+t}).join('');
const td=s.todo||[];const dots=s.bots.map(b=>`<span class="tag">${I[b.state]||'⚪'} ${e(b.name)}</span>`).join('');
